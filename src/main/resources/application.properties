spring.application.name=urlshortener

server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/urlshortener}
spring.datasource.username=${DATABASE_USERNAME:urlshortener}
spring.datasource.password=${DATABASE_PASSWORD:urlshortener}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
urlshortener.base-url=${BASE_URL:http://localhost:8080}
